<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест уровня владения ИКТ</title>
<style>
  :root{
    --bg:#F5F6F3; --surface:#FFFFFF; --border:#DFE3DE;
    --ink:#16262A; --ink-soft:#55625D;
    --accent:#2F6F63; --accent-dark:#1D4A41; --accent-soft:#E3EFEC;
    --gold:#C79A3D;
    --success:#2F8F5B; --success-soft:#E4F5EC;
    --danger:#B23A2E; --danger-soft:#FBEAE7;
    --warning:#C79A3D; --warning-soft:#FBF1DE;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121A1B; --surface:#1B2426; --border:#2B3638;
      --ink:#EAF0EE; --ink-soft:#AAB8B4;
      --accent:#4FA391; --accent-dark:#2F6F63; --accent-soft:#1A302B;
      --gold:#E0BB63;
      --success:#59C98A; --success-soft:#173324;
      --danger:#E1685C; --danger-soft:#3A211D;
      --warning:#E0BB63; --warning-soft:#3A2E14;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121A1B; --surface:#1B2426; --border:#2B3638;
    --ink:#EAF0EE; --ink-soft:#AAB8B4;
    --accent:#4FA391; --accent-dark:#2F6F63; --accent-soft:#1A302B;
    --gold:#E0BB63;
    --success:#59C98A; --success-soft:#173324;
    --danger:#E1685C; --danger-soft:#3A211D;
    --warning:#E0BB63; --warning-soft:#3A2E14;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .layout{display:flex;gap:24px;max-width:980px;margin:0 auto;padding:28px 20px 60px;align-items:flex-start;}
  .main{flex:1 1 720px;max-width:720px;min-width:0;}
  .sidebar{
    flex:0 0 240px;position:sticky;top:20px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:18px;
  }
  .sidebar h2{font-size:14px;margin:0 0 4px;color:var(--ink);}
  .sidebar-hint{font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;}
  .sidebar-item{display:block;padding:8px 0;border-bottom:1px solid var(--border);}
  .sidebar-item:last-child{border-bottom:none;}
  .sidebar-week{display:block;font-size:11.5px;font-weight:700;color:var(--accent-dark);}
  .sidebar-topic{display:block;font-size:12px;line-height:1.4;margin-top:1px;text-decoration:none;}
  .sidebar-item a.sidebar-topic{color:var(--accent-dark);text-decoration:underline;}
  .sidebar-item a.sidebar-pending{color:var(--ink-soft);text-decoration:none;}
  .sidebar-item a.sidebar-pending:hover{color:var(--ink);text-decoration:underline;}
  @media (max-width:820px){
    .layout{flex-direction:column;}
    .sidebar{position:static;width:100%;flex:none;}
  }

  header.top{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header.top h1{font-size:20px;margin:0;}
  .header-controls{display:flex;gap:10px;align-items:center;flex:0 0 auto;flex-wrap:wrap;}
  .stats-toggle{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .lang-switch{display:flex;gap:4px;flex:0 0 auto;}
  .lang-switch button{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:6px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .lang-switch button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:22px;
  }
  .hidden{display:none !important;}

  .start-lead{font-size:14.5px;color:var(--ink-soft);margin-bottom:18px;}
  .mode-btn{
    display:block;width:100%;text-align:left;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);padding:16px 18px;margin-bottom:12px;
    cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .mode-btn b{display:block;font-size:15px;margin-bottom:3px;}
  .mode-btn span{font-size:12.5px;color:var(--ink-soft);}
  .mode-btn.primary{border-color:var(--accent);}
  .mode-btn.primary b{color:var(--accent-dark);}

  .week-picker{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
  .week-picker label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .week-picker-row{display:flex;gap:8px;}
  .week-picker-row select{
    flex:1;border:1px solid var(--border);border-radius:6px;padding:9px 10px;
    font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  }
  .week-picker-row button{
    border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;
    padding:9px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }

  .loading-box{text-align:center;padding:30px 10px;}
  .spinner{
    width:34px;height:34px;border-radius:50%;border:3px solid var(--border);
    border-top-color:var(--accent);margin:0 auto 16px;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
  .stop-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .error-box{
    background:var(--danger-soft);color:var(--danger);border-radius:8px;
    padding:12px 14px;font-size:13.5px;margin-bottom:14px;text-align:left;
  }
  .error-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .error-actions button{
    border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  }
  .error-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

  .progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);}
  .progress-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:var(--accent);transition:width .25s;}
  .topic-badge{
    display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent-dark);
    background:var(--accent-soft);padding:4px 10px;border-radius:20px;margin-bottom:12px;
  }
  .difficulty-badge{
    display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
    margin-bottom:12px;margin-left:6px;
  }
  .difficulty-easy{background:var(--success-soft);color:var(--success);}
  .difficulty-medium{background:var(--warning-soft);color:var(--warning);}
  .difficulty-hard{background:var(--danger-soft);color:var(--danger);}
  .question-text{font-size:16.5px;font-weight:600;margin-bottom:18px;}
  .option-btn{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    border:1px solid var(--border);border-radius:8px;background:var(--surface);
    padding:12px 14px;margin-bottom:10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);
  }
  .option-btn:disabled{cursor:default;}
  .option-btn:not(:disabled):hover{border-color:var(--accent);}
  .opt-letter{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--border);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }
  .option-btn.correct{border-color:var(--success);background:var(--success-soft);}
  .option-btn.correct .opt-letter{background:var(--success);color:#fff;}
  .option-btn.incorrect{border-color:var(--danger);background:var(--danger-soft);}
  .option-btn.incorrect .opt-letter{background:var(--danger);color:#fff;}
  .explanation{border-radius:8px;padding:12px 14px;font-size:13.5px;margin:6px 0 18px;}
  .explanation.ok{background:var(--success-soft);color:var(--success);}
  .explanation.no{background:var(--danger-soft);color:var(--danger);}
  .next-btn{
    background:var(--accent);color:#fff;border:none;border-radius:7px;
    padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }

  .score-head{text-align:center;margin-bottom:22px;}
  .score-num{font-size:42px;font-weight:700;color:var(--accent-dark);}
  .level-badge{
    display:inline-block;margin-top:6px;font-size:13px;font-weight:700;
    padding:5px 14px;border-radius:20px;
  }
  .level-low{background:var(--danger-soft);color:var(--danger);}
  .level-mid{background:var(--warning-soft);color:var(--warning);}
  .level-good{background:var(--accent-soft);color:var(--accent-dark);}
  .level-high{background:var(--success-soft);color:var(--success);}
  .score-sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .section-label{font-size:13.5px;font-weight:700;margin:22px 0 10px;color:var(--ink);}
  .topic-row{margin-bottom:12px;}
  .topic-row-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px;}
  .topic-row-head span:first-child{flex:1;}
  .topic-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
  .topic-bar-fill{height:100%;}
  .bar-low{background:var(--danger);} .bar-mid{background:var(--warning);} .bar-good{background:var(--success);}
  .rec-item{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .rec-topic{font-size:13px;font-weight:700;color:var(--accent-dark);margin-bottom:3px;}
  .rec-lab{font-size:13px;}
  .rec-lab a{color:var(--accent-dark);font-weight:700;text-decoration:underline;}
  .rec-lab a.sidebar-pending{color:var(--ink-soft);font-weight:400;text-decoration:none;}
  .rec-lab a.sidebar-pending:hover{color:var(--ink);text-decoration:underline;}
  .rec-empty{font-size:13.5px;color:var(--ink-soft);}

  .review-item{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .review-topic{font-size:11px;font-weight:700;color:var(--accent-dark);margin-bottom:6px;}
  .review-question{font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .review-answer-row{font-size:13px;margin-bottom:3px;}
  .review-answer-row b{font-weight:700;}
  .review-answer-row.wrong{color:var(--danger);}
  .review-answer-row.correct{color:var(--success);}
  .review-explanation{font-size:13px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
  .review-empty{font-size:13.5px;color:var(--ink-soft);}

  .result-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}

  .results-actions{display:flex;gap:10px;margin-top:22px;}
  .restart-btn{
    flex:1;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);border-radius:7px;padding:11px;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .pdf-btn{
    flex:1;border:1px solid var(--accent);background:var(--surface);
    color:var(--accent-dark);border-radius:7px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }

  .name-field{margin-bottom:18px;}
  .name-field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .name-field input{
    width:100%;border:1px solid var(--border);border-radius:6px;padding:10px 12px;
    font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink);
  }
  .name-field input.invalid{border-color:var(--danger);}

  @media print{
    :root{
      --bg:#F5F6F3 !important; --surface:#FFFFFF !important; --ink:#16262A !important; --ink-soft:#55625D !important;
      --border:#DFE3DE !important; --accent:#2F6F63 !important; --accent-dark:#1D4A41 !important; --accent-soft:#E3EFEC !important;
      --success:#2F8F5B !important; --success-soft:#E4F5EC !important; --danger:#B23A2E !important; --danger-soft:#FBEAE7 !important;
      --warning:#C79A3D !important; --warning-soft:#FBF1DE !important;
    }
    body{background:#fff !important;}
    body *{visibility:hidden;}
    #results-printable, #results-printable *{visibility:visible;}
    #results-printable{position:absolute;left:0;top:0;width:100%;padding:16px;}
    .review-item, .rec-item, .topic-row{break-inside:avoid;}
  }

  .stats-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .stats-back-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:6px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;
  }
  .stats-summary{display:flex;gap:16px;margin-bottom:8px;}
  .stats-summary-item{
    flex:1;border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;
  }
  .stats-summary-num{font-size:30px;font-weight:700;color:var(--accent-dark);}
  .stats-summary-label{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .stats-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .stats-row:last-child{border-bottom:none;}
  .stats-row-name{flex:1;color:var(--ink);}
  .stats-row-val{color:var(--ink-soft);white-space:nowrap;}
  .stats-empty{font-size:13px;color:var(--ink-soft);padding:8px 0;}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <h2 id="sidebar-title">Лабораторные работы</h2>
    <div class="sidebar-hint" id="sidebar-hint">По неделям курса</div>
    <div id="sidebar-list"></div>
  </aside>

  <div class="main">

  <header class="top">
    <h1 id="page-title">Тест уровня владения ИКТ</h1>
    <div class="header-controls">
      <button class="stats-toggle" id="btn-stats"></button>
      <div class="lang-switch" id="lang-switch">
        <button data-lang="kk">ҚАЗ</button>
        <button data-lang="ru">РУС</button>
        <button data-lang="en">ENG</button>
      </div>
    </div>
  </header>

  <section id="view-start" class="card">
    <p class="start-lead" id="start-lead"></p>

    <div class="name-field">
      <label for="student-name" id="student-name-label"></label>
      <input type="text" id="student-name" autocomplete="name">
    </div>

    <button class="mode-btn primary" id="btn-full">
      <b id="full-title"></b>
      <span id="full-desc"></span>
    </button>
    <button class="mode-btn" id="btn-rk1">
      <b id="rk1-title"></b>
      <span id="rk1-desc"></span>
    </button>
    <button class="mode-btn" id="btn-rk2">
      <b id="rk2-title"></b>
      <span id="rk2-desc"></span>
    </button>

    <div class="week-picker">
      <label for="week-select" id="week-picker-label"></label>
      <div class="week-picker-row">
        <select id="week-select"></select>
        <button id="btn-week"></button>
      </div>
    </div>
  </section>

  <section id="view-loading" class="card hidden">
    <div class="loading-box">
      <div id="loading-generating">
        <div class="spinner"></div>
        <p class="loading-text" id="loading-text"></p>
        <button class="stop-btn" id="btn-stop"></button>
      </div>
      <div id="loading-error" class="hidden">
        <div class="error-box" id="error-text"></div>
        <div class="error-actions" id="error-actions"></div>
      </div>
    </div>
  </section>

  <section id="view-quiz" class="card hidden">
    <div class="progress-head">
      <span id="progress-text"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="topic-badge" id="topic-badge"></div><div class="difficulty-badge hidden" id="difficulty-badge"></div>
    <div class="question-text" id="question-text"></div>
    <div id="options-wrap"></div>
    <div class="explanation hidden" id="explanation-box"></div>
    <button class="next-btn hidden" id="next-btn"></button>
  </section>

  <section id="view-results" class="card hidden">
    <div id="results-printable">
      <div class="result-meta" id="result-meta"></div>
      <div class="score-head">
        <div class="score-num" id="result-score">0%</div>
        <div class="level-badge" id="result-level"></div>
        <div class="score-sub" id="result-sub"></div>
      </div>

      <div class="section-label" id="result-by-week-label"></div>
      <div id="topic-list"></div>

      <div class="section-label" id="rec-title-label"></div>
      <div id="rec-wrap"></div>

      <div class="section-label" id="review-title-label"></div>
      <div id="review-wrap"></div>
    </div>

    <div class="results-actions">
      <button class="restart-btn" id="restart-btn"></button>
      <button class="pdf-btn" id="btn-pdf"></button>
    </div>
  </section>

  <section id="view-stats" class="card hidden">
    <div class="stats-head">
      <div class="section-label" id="stats-title-label" style="margin-top:0;"></div>
      <button class="stats-back-btn" id="btn-stats-back"></button>
    </div>

    <div id="stats-loading" class="loading-box">
      <div class="spinner"></div>
    </div>

    <div id="stats-error" class="hidden">
      <div class="error-box" id="stats-error-text"></div>
      <button class="stop-btn" id="btn-stats-retry"></button>
    </div>

    <div id="stats-body" class="hidden">
      <div class="stats-summary">
        <div class="stats-summary-item">
          <div class="stats-summary-num" id="stats-total">0</div>
          <div class="stats-summary-label" id="stats-total-label"></div>
        </div>
        <div class="stats-summary-item">
          <div class="stats-summary-num" id="stats-avg">0%</div>
          <div class="stats-summary-label" id="stats-avg-label"></div>
        </div>
      </div>

      <div class="section-label" id="stats-by-mode-label"></div>
      <div id="stats-by-mode"></div>

      <div class="section-label" id="stats-by-grade-label"></div>
      <div id="stats-by-grade"></div>

      <div class="section-label" id="stats-weak-weeks-label"></div>
      <div id="stats-weak-weeks"></div>

      <div class="section-label" id="stats-recent-label"></div>
      <div id="stats-recent"></div>
    </div>
  </section>

  </div>
</div>

<script>
(function(){
  "use strict";

  // Адрес сервера задан один раз здесь — менять нужно только эту строку.
  var ENDPOINT = "https://ict-quiz-backend.onrender.com/api/generate-questions";
  var TRACK_ENDPOINT = ENDPOINT.replace(/\/api\/generate-questions$/, "/api/track-result");
  var STATS_ENDPOINT = ENDPOINT.replace(/\/api\/generate-questions$/, "/api/stats");
  var LANG_KEY = "ict_test_lang";

  // 15 недель курса — названия тем в трёх языках, соответствуют WEEK_TOPICS в
  // server.js. Список используется для подписи вопросов и панели слева; сами
  // формулировки вопросов и порядок задаёт сервер (он же подставляет
  // канонический topic по номеру недели и языку).
  var WEEK_TOPICS = {
    1:  { ru: "Роль ИКТ в развитии общества, стандарты ИКТ", kk: "ААТ-ның қоғам дамуындағы рөлі, ААТ стандарттары", en: "The role of ICT in society's development, ICT standards" },
    2:  { ru: "Архитектура компьютерных систем", kk: "Компьютерлік жүйелер архитектурасы", en: "Computer systems architecture" },
    3:  { ru: "Операционные системы: функции, права доступа, аутентификация", kk: "Операциялық жүйелер: функциялары, қатынау құқықтары, аутентификация", en: "Operating systems: functions, access rights, authentication" },
    4:  { ru: "Взаимодействие человека и компьютера: интерфейсы (CLI, GUI)", kk: "Адам мен компьютердің өзара әрекеттесуі: интерфейстер (CLI, GUI)", en: "Human-computer interaction: interfaces (CLI, GUI)" },
    5:  { ru: "Системы баз данных: архитектура, нормализация", kk: "Дерекқор жүйелері: архитектурасы, нормалануы", en: "Database systems: architecture, normalization" },
    6:  { ru: "Анализ и управление данными, работа в MS Excel", kk: "Деректерді талдау және басқару, MS Excel-де жұмыс", en: "Data analysis and management, working in MS Excel" },
    7:  { ru: "Сети и телекоммуникации, IP-адресация, маршрутизация", kk: "Желілер және телекоммуникациялар, IP-адрестеу, маршруттау", en: "Networks and telecommunications, IP addressing, routing" },

  function validateLLMQuestions(data){
    if(!Array.isArray(data)) return [];
    var ALLOWED_DIFFICULTY = ["easy","medium","hard"];
    return data.filter(function(q){
      return q && typeof q.question==="string" && q.question.trim() &&
        Array.isArray(q.options) && q.options.length===4 &&
        q.options.every(function(o){ return typeof o==="string" && o.trim(); }) &&
        Number.isInteger(q.correct_index) && q.correct_index>=0 && q.correct_index<=3 &&
        Number.isInteger(q.week) && q.week>=1 && q.week<=15 &&
        typeof q.explanation==="string";
    }).map(function(q){
      return {
        week: q.week,
        topic: (WEEK_TOPICS[q.week] && WEEK_TOPICS[q.week][currentLang]) || q.topic,
        difficulty: ALLOWED_DIFFICULTY.indexOf(q.difficulty)!==-1 ? q.difficulty : null,
        question: q.question,
        options: q.options,
        correct_index: q.correct_index,
        explanation: q.explanation
      };
    });
  }

  async function generateLLMQuestions(signal, cfg){
    var body = { totalQuestions: cfg.totalQuestions, lang: currentLang };
    if(cfg.weeks) body.weeks = cfg.weeks;
    var resp;
    try{
      resp = await fetch(ENDPOINT, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body),
        signal: signal
      });
    }catch(e){
      if(e && e.name==="AbortError") throw {code:"cancelled"};
      throw {code:"network_error", message:String(e && e.message || e)};
    }
    if(!resp.ok){
      var errBody = null;
      try{ errBody = await resp.json(); }catch(e2){}
      throw {code:"http_error", status:resp.status, message: errBody && errBody.message};
    }
    var data;
    try{ data = await resp.json(); }catch(e3){ throw {code:"invalid_json"}; }
    return validateLLMQuestions(data);
  }

  function errorMessage(err){
    var code = err && err.code;
    var t = T();
    switch(code){
      case "network_error": return t.errNetwork;
      case "http_error": return t.errHttp+(err.status ? " (HTTP "+err.status+")" : "")+(err.message ? ": "+err.message : ".");
      case "invalid_json": return t.errInvalidJson;
      default: return t.errDefault;
    }
  }

    showView("loading");

      if(llmQs.length < Math.max(5, Math.floor(cfg.totalQuestions/2))){ throw {code:"invalid_json"}; }
      finalizeQuestions(shuffle(llmQs));
    }catch(err){
      if(err && err.code==="cancelled"){ showView("start"); return; }
      renderError(err||{});
    }
  }

  function finalizeQuestions(questions){
    state.questions = questions;
    state.current = 0;
    state.answers = new Array(questions.length).fill(null);
    showView("quiz");
    renderQuestion();
  }

  function renderQuestion(){
    var q = state.questions[state.current];
    var total = state.questions.length;
    var t = T();
    els.progressText.textContent = t.questionOf(state.current+1, total);
    els.progressFill.style.width = Math.round((state.current/total)*100)+"%";
    els.topicBadge.textContent = t.week+" "+q.week+" — "+WEEK_TOPICS[q.week][currentLang];
    if(q.difficulty){
      els.difficultyBadge.textContent = t.difficulty[q.difficulty];
      els.difficultyBadge.className = "difficulty-badge difficulty-"+q.difficulty;
    } else {
      els.difficultyBadge.className = "difficulty-badge hidden";
    }
    els.questionText.textContent = q.question;
    els.optionsWrap.innerHTML = "";
    var answered = state.answers[state.current];

    q.options.forEach(function(opt, idx){
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.disabled = answered!==null;
      var letterSpan = document.createElement("span");
      letterSpan.className = "opt-letter";
      letterSpan.textContent = t.letters[idx];
      var textSpan = document.createElement("span");
      textSpan.className = "opt-text";
      textSpan.textContent = opt;
      btn.appendChild(letterSpan);
      btn.appendChild(textSpan);
      if(answered!==null){
        if(idx===q.correct_index) btn.classList.add("correct");
        else if(idx===answered) btn.classList.add("incorrect");
      }
      btn.onclick = function(){ selectOption(idx); };
      els.optionsWrap.appendChild(btn);
    });

    if(answered!==null){
      var wasCorrect = answered===q.correct_index;
      els.explanationBox.classList.remove("hidden");
      els.explanationBox.className = "explanation " + (wasCorrect ? "ok" : "no");
      els.explanationBox.textContent = (wasCorrect ? t.correctPrefix : t.incorrectPrefix) + q.explanation;
      els.nextBtn.classList.remove("hidden");
      els.nextBtn.textContent = (state.current===total-1) ? t.finishBtn : t.nextBtn;
    } else {
      els.explanationBox.classList.add("hidden");
      els.nextBtn.classList.add("hidden");
    }
  }

  function selectOption(idx){
    if(state.answers[state.current]!==null) return;
    state.answers[state.current] = idx;
    renderQuestion();
  }

  function computeResults(){
    var byWeek = {};
    state.questions.forEach(function(q, i){
      if(!byWeek[q.week]) byWeek[q.week] = {week:q.week, correct:0, total:0};
      byWeek[q.week].total++;
      if(state.answers[i]===q.correct_index) byWeek[q.week].correct++;
    });
    var totalCorrect = 0, totalQ = state.questions.length;
    Object.keys(byWeek).forEach(function(w){ totalCorrect += byWeek[w].correct; });
    var overallPercent = Math.round((totalCorrect/totalQ)*100);
    var grade = gradeFor(overallPercent);
    var weekRows = Object.keys(byWeek).map(function(w){
      var v = byWeek[w];
      return {week:v.week, correct:v.correct, total:v.total, percent:Math.round((v.correct/v.total)*100)};
    }).sort(function(a,b){ return a.percent-b.percent || a.week-b.week; });
    state.results = {byWeek:weekRows, overallPercent:overallPercent, grade:grade, totalCorrect:totalCorrect, totalQ:totalQ, finishedAt:new Date()};
  }

  function barClass(p){ return p<40 ? "bar-low" : (p<70 ? "bar-mid" : "bar-good"); }

  function finishTest(){
    computeResults();
    showView("results");
    renderResults();
    trackResult();
  }

  // Отправляет сводку по завершённому тесту на сервер для статистики.
  // Не блокирует и не влияет на интерфейс — ошибка отправки просто
  // игнорируется, результат теста пользователю уже показан.
  function trackResult(){
    var r = state.results;
    var cfg = state.modeConfig;
    var modeKey = cfg===TEST_MODES.full ? "full" : cfg===TEST_MODES.rk1 ? "rk1" : cfg===TEST_MODES.rk2 ? "rk2" : "week";
    var payload = {
      studentName: state.studentName,
      mode: modeKey,
      week: (modeKey==="week" && cfg.weeks && cfg.weeks.length===1) ? cfg.weeks[0] : null,
      lang: currentLang,
      totalQuestions: r.totalQ,
      correctAnswers: r.totalCorrect,
      percent: r.overallPercent,
      gradeLetter: r.grade.letter,
      weakWeeks: r.byWeek.filter(function(w){ return w.percent<70; }).map(function(w){ return {week:w.week, percent:w.percent}; })
    };
    try{
      fetch(TRACK_ENDPOINT, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      }).catch(function(){});
    }catch(e){}
  }

  // Ссылка на лабораторную неделю — если url ещё не задан, всё равно рисуем
  // <a> с курсором и подсказкой, просто клик ничего не делает. Так вставка
  // реальных ссылок в LAB_LINKS позже не потребует менять вёрстку.
  function makeLabLink(week, extraClass){
    var lab = LAB_LINKS[week];
    var a = document.createElement("a");
    a.className = extraClass;
    if(lab && lab.url){
      a.href = lab.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = lab.title || WEEK_TOPICS[week][currentLang];
    } else {
      a.href = "#";
      a.classList.add("sidebar-pending");
      a.title = T().labPendingTitle;
      a.textContent = (lab && lab.title) || WEEK_TOPICS[week][currentLang];
      a.onclick = function(ev){ ev.preventDefault(); };
    }
    return a;
  }

  function renderResults(){
    var r = state.results;
    var t = T();
    var when = "";
    try{ when = r.finishedAt.toLocaleString(); }catch(e){}
    els.resultMeta.textContent = t.resultMeta(state.studentName || "—", when);
    els.resultScore.textContent = r.overallPercent+"%";
    els.resultLevel.textContent = r.grade.letter+" · "+r.grade.gpa.toFixed(2)+" · "+t.gradeDesc[r.grade.key];
    els.resultLevel.className = "level-badge level-"+r.grade.key;
    els.resultSub.textContent = t.correctOf(r.totalCorrect, r.totalQ);

    els.topicList.innerHTML = "";
    r.byWeek.forEach(function(w){
      var row = document.createElement("div");
      row.className = "topic-row";
      var head = document.createElement("div");
      head.className = "topic-row-head";
      var headLeft = document.createElement("span");
      headLeft.textContent = t.week+" "+w.week+" — "+WEEK_TOPICS[w.week][currentLang];
      var headRight = document.createElement("span");
      headRight.textContent = w.correct+"/"+w.total+" ("+w.percent+"%)";
      head.appendChild(headLeft);
      head.appendChild(headRight);
      var bar = document.createElement("div");
      bar.className = "topic-bar";
      var fill = document.createElement("div");
      fill.className = "topic-bar-fill " + barClass(w.percent);
      fill.style.width = w.percent+"%";
      bar.appendChild(fill);
      row.appendChild(head);
      row.appendChild(bar);
      els.topicList.appendChild(row);
    });

    var weak = r.byWeek.filter(function(w){ return w.percent<70; });
    els.recWrap.innerHTML = "";
    if(weak.length===0){
      var p = document.createElement("p");
      p.className = "rec-empty";
      p.textContent = t.allGood;
      els.recWrap.appendChild(p);
    } else {
      weak.forEach(function(w){
        var item = document.createElement("div");
        item.className = "rec-item";
        var topicDiv = document.createElement("div");
        topicDiv.className = "rec-topic";
        topicDiv.textContent = t.week+" "+w.week+" — "+WEEK_TOPICS[w.week][currentLang]+" ("+w.percent+"%)";
        var labDiv = document.createElement("div");
        labDiv.className = "rec-lab";
        labDiv.appendChild(makeLabLink(w.week, ""));
        item.appendChild(topicDiv);
        item.appendChild(labDiv);
        els.recWrap.appendChild(item);
      });
    }

    els.reviewWrap.innerHTML = "";
    var wrongIdx = [];
    state.questions.forEach(function(q, i){
      if(state.answers[i] !== q.correct_index) wrongIdx.push(i);
    });
    if(wrongIdx.length===0){
      var pr = document.createElement("p");
      pr.className = "review-empty";
      pr.textContent = t.reviewAllCorrect;
      els.reviewWrap.appendChild(pr);
    } else {
      wrongIdx.forEach(function(i){
        var q = state.questions[i];
        var chosen = state.answers[i];
        var item = document.createElement("div");
        item.className = "review-item";

        var topicDiv = document.createElement("div");
        topicDiv.className = "review-topic";
        topicDiv.textContent = t.week+" "+q.week+" — "+WEEK_TOPICS[q.week][currentLang];
        item.appendChild(topicDiv);

        var qDiv = document.createElement("div");
        qDiv.className = "review-question";
        qDiv.textContent = q.question;
        item.appendChild(qDiv);

        var yourRow = document.createElement("div");
        yourRow.className = "review-answer-row wrong";
        var yourLetter = (chosen!=null) ? t.letters[chosen] : "—";
        var yourText = (chosen!=null) ? q.options[chosen] : "";
        yourRow.innerHTML = "<b>"+t.reviewYourAnswer+"</b> ";
        yourRow.appendChild(document.createTextNode(yourLetter+") "+yourText));
        item.appendChild(yourRow);

        var correctRow = document.createElement("div");
        correctRow.className = "review-answer-row correct";
        correctRow.innerHTML = "<b>"+t.reviewCorrectAnswer+"</b> ";
        correctRow.appendChild(document.createTextNode(t.letters[q.correct_index]+") "+q.options[q.correct_index]));
        item.appendChild(correctRow);

        var explDiv = document.createElement("div");
        explDiv.className = "review-explanation";
        explDiv.textContent = q.explanation;
        item.appendChild(explDiv);

        els.reviewWrap.appendChild(item);
      });
    }
  }

  function statsRow(name, val){
    var row = document.createElement("div");
    row.className = "stats-row";
    var nameSpan = document.createElement("span");
    nameSpan.className = "stats-row-name";
    nameSpan.textContent = name;
    var valSpan = document.createElement("span");
    valSpan.className = "stats-row-val";
    valSpan.textContent = val;
    row.appendChild(nameSpan);
    row.appendChild(valSpan);
    return row;
  }

  function statsEmpty(container){
    var p = document.createElement("p");
    p.className = "stats-empty";
    p.textContent = T().statsNoData;
    container.appendChild(p);
  }

  function renderStats(data){
    var t = T();
    state.statsData = data;
    els.statsTotal.textContent = data.total;
    els.statsAvg.textContent = data.avgPercent+"%";

    els.statsByMode.innerHTML = "";
    if(!data.byMode.length){ statsEmpty(els.statsByMode); }
    data.byMode.slice().sort(function(a,b){ return b.count-a.count; }).forEach(function(m){
      var name = t.modeNames[m.mode] || m.mode;
      els.statsByMode.appendChild(statsRow(name, t.statsAttempts(m.count)+" · "+m.avgPercent+"%"));
    });

    els.statsByGrade.innerHTML = "";
    var gradeOrder = ["A","A-","B+","B","B-","C+","C","C-","D+","D","FX","F"];
    var anyGrade = false;
    gradeOrder.forEach(function(g){
      if(data.byGrade[g]){
        anyGrade = true;
        els.statsByGrade.appendChild(statsRow(g, t.statsAttempts(data.byGrade[g])));
      }
    });
    if(!anyGrade){ statsEmpty(els.statsByGrade); }

    els.statsWeakWeeks.innerHTML = "";
    if(!data.weakWeeksRanked.length){ statsEmpty(els.statsWeakWeeks); }
    data.weakWeeksRanked.slice(0,8).forEach(function(w){
      var name = t.week+" "+w.week+" — "+(WEEK_TOPICS[w.week] ? WEEK_TOPICS[w.week][currentLang] : "");
      els.statsWeakWeeks.appendChild(statsRow(name, t.statsMentions(w.count)));
    });

    els.statsRecent.innerHTML = "";
    if(!data.recent.length){ statsEmpty(els.statsRecent); }
    data.recent.forEach(function(r){
      var modeName = t.modeNames[r.mode] || r.mode;
      var when = "";
      try{ when = new Date(r.createdAt).toLocaleString(); }catch(e){}
      var label = (r.studentName || "—") + " — " + modeName + (r.week ? " ("+t.week+" "+r.week+")" : "") + " — " + when;
      els.statsRecent.appendChild(statsRow(label, (r.percent!=null ? r.percent+"%" : "—")+" "+(r.gradeLetter||"")));
    });
  }

  async function fetchStats(){
    els.statsLoading.classList.remove("hidden");
    els.statsErrorBox.classList.add("hidden");
    els.statsBody.classList.add("hidden");
    try{
      var resp = await fetch(STATS_ENDPOINT);
      if(!resp.ok){
        var body = null;
        try{ body = await resp.json(); }catch(e2){}
        throw new Error((body && body.message) || ("HTTP "+resp.status));
      }
      var data = await resp.json();
      els.statsLoading.classList.add("hidden");
      els.statsBody.classList.remove("hidden");
      renderStats(data);
    }catch(err){
      els.statsLoading.classList.add("hidden");
      els.statsErrorBox.classList.remove("hidden");
      els.statsErrorText.textContent = T().statsErr;
    }
  }

  function renderSidebar(){
    els.sidebarList.innerHTML = "";
    Object.keys(WEEK_TOPICS).forEach(function(w){
      var item = document.createElement("div");
      item.className = "sidebar-item";
      var weekSpan = document.createElement("span");
      weekSpan.className = "sidebar-week";
      weekSpan.textContent = T().week+" "+w;
      item.appendChild(weekSpan);
      item.appendChild(makeLabLink(Number(w), "sidebar-topic"));
      els.sidebarList.appendChild(item);
    });
  }

  function renderWeekSelect(){
    var prev = els.weekSelect.value;
    els.weekSelect.innerHTML = "";
    Object.keys(WEEK_TOPICS).forEach(function(w){
      var opt = document.createElement("option");
      opt.value = w;
      opt.textContent = T().week+" "+w+" — "+WEEK_TOPICS[w][currentLang];
      els.weekSelect.appendChild(opt);
    });
    if(prev) els.weekSelect.value = prev;
  }

  function applyLanguage(){
    var t = T();
    document.documentElement.lang = currentLang;
    document.title = t.pageTitle;
    els.pageTitle.textContent = t.pageTitle;
    els.sidebarTitle.textContent = t.sidebarTitle;
    els.sidebarHint.textContent = t.sidebarHint;
    els.startLead.textContent = t.startLead;
    els.studentNameLabel.textContent = t.studentNameLabel;
    els.studentNameInput.placeholder = t.studentNamePlaceholder;
    els.fullTitle.textContent = t.fullTitle;
    els.fullDesc.textContent = t.fullDesc;
    els.rk1Title.textContent = t.rk1Title;
    els.rk1Desc.textContent = t.rk1Desc;
    els.rk2Title.textContent = t.rk2Title;
    els.rk2Desc.textContent = t.rk2Desc;
    els.weekPickerLabel.textContent = t.weekPickerLabel;
    els.weekBtn.textContent = t.weekBtn;
    els.loadingText.textContent = t.loadingText;
    els.stopBtn.textContent = t.stopBtn;
    els.resultByWeekLabel.textContent = t.resultByWeek;
    els.recTitleLabel.textContent = t.recTitle;
    els.reviewTitleLabel.textContent = t.reviewTitle;
    els.restartBtn.textContent = t.restartBtn;
    els.pdfBtn.textContent = t.pdfBtn;
    els.statsBtn.textContent = t.statsBtn;
    els.statsTitleLabel.textContent = t.statsTitle;
    els.statsBackBtn.textContent = t.statsBack;
    els.statsRetryBtn.textContent = t.statsRetry;
    els.statsTotalLabel.textContent = t.statsTotal;
    els.statsAvgLabel.textContent = t.statsAvg;
    els.statsByModeLabel.textContent = t.statsByMode;
    els.statsByGradeLabel.textContent = t.statsByGrade;
    els.statsWeakWeeksLabel.textContent = t.statsWeakWeeks;
    els.statsRecentLabel.textContent = t.statsRecent;

    Array.prototype.forEach.call(els.langSwitch.querySelectorAll("button"), function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-lang")===currentLang);
    });

    renderSidebar();
    renderWeekSelect();
    if(!els.views.quiz.classList.contains("hidden") && state.questions.length){ renderQuestion(); }
    if(!els.views.results.classList.contains("hidden") && state.results){ renderResults(); }
    if(!els.views.stats.classList.contains("hidden") && state.statsData){ renderStats(state.statsData); }
    if(!els.views.loading.classList.contains("hidden") && !els.loadingError.classList.contains("hidden")){
      // re-render the currently shown error in the new language
      renderError(state.lastError || {});
    }
  }

  function setLang(lang){
    if(!I18N[lang] || lang===currentLang){ return; }
    currentLang = lang;
    try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
    applyLanguage();
  }

  els.langSwitch.addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-lang]");
    if(btn) setLang(btn.getAttribute("data-lang"));
  });

  function requireStudentName(){
    var v = els.studentNameInput.value.trim();
    if(!v){
      els.studentNameInput.classList.add("invalid");
      els.studentNameInput.focus();
      return null;
    }
    els.studentNameInput.classList.remove("invalid");
    return v;
  }

  els.fullBtn.onclick = function(){ var n=requireStudentName(); if(!n) return; state.studentName=n; startTest(TEST_MODES.full); };
  els.rk1Btn.onclick = function(){ var n=requireStudentName(); if(!n) return; state.studentName=n; startTest(TEST_MODES.rk1); };
  els.rk2Btn.onclick = function(){ var n=requireStudentName(); if(!n) return; state.studentName=n; startTest(TEST_MODES.rk2); };
  els.weekBtn.onclick = function(){
    var n=requireStudentName(); if(!n) return; state.studentName=n;
    var w = Number(els.weekSelect.value);
    startTest({ weeks: [w], totalQuestions: 20 });
  };
  els.restartBtn.onclick = function(){ showView("start"); };
  function pad2(n){ return (n<10?"0":"")+n; }
  function fileTimestamp(d){
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"_"+pad2(d.getHours())+"-"+pad2(d.getMinutes());
  }
  function sanitizeFilename(s){
    return String(s).replace(/[\/\\:\*\?"<>\|]/g, "_").trim();
  }

  els.pdfBtn.onclick = function(){
    var r = state.results;
    var namePart = sanitizeFilename(state.studentName || "report");
    var when = fileTimestamp((r && r.finishedAt) ? r.finishedAt : new Date());
    var oldTitle = document.title;
    document.title = "ICT-report_" + namePart + "_" + when;
    function restore(){
      document.title = oldTitle;
      window.removeEventListener("afterprint", restore);
    }
    window.addEventListener("afterprint", restore);
    window.print();
    setTimeout(restore, 3000); // резервный возврат, если afterprint почему-то не сработал
  };
  els.statsBtn.onclick = function(){ showView("stats"); fetchStats(); };
  els.statsBackBtn.onclick = function(){ showView("start"); };
  els.statsRetryBtn.onclick = function(){ fetchStats(); };
  els.nextBtn.onclick = function(){
    if(state.current < state.questions.length-1){
      state.current++;
      renderQuestion();
    } else {
      finishTest();
    }
  };
  els.stopBtn.onclick = function(){ if(abortCtl) abortCtl.abort(); };

  applyLanguage();
  showView("start");
})();
</script>
</body>
</html>
